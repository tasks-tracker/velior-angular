<div class="message-input">
  <mat-form-field appearance="outline" class="message-input__field">
    <textarea
      matInput
      [value]="value()"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
      cdkTextareaAutosize
      cdkAutosizeMinRows="1"
      cdkAutosizeMaxRows="6"
      rows="1"
    ></textarea>
  </mat-form-field>
  <button
    mat-icon-button
    color="primary"
    class="message-input__send"
    type="button"
    (click)="onSubmit()"
    [attr.aria-label]="'Отправить'"
  >
    <mat-icon>send</mat-icon>
  </button>
</div>
