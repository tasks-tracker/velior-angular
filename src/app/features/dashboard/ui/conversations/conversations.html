<div class="conversations-container">
  <mat-tab-group
    class="conversations-tabs"
    [selectedIndex]="activeTab"
    (selectedIndexChange)="conversationsService.setActiveTab($event)"
  >
    <mat-tab label="Беседы">
      <mat-nav-list class="conversations-list">
        @if (isLoading) {
          <div>Загрузка...</div>
        } @else if (error) {
          <div>{{ error }}</div>
        } @else if (conversations.length === 0) {
          <div>Нет бесед. Начните переписку с пользователем</div>
        } @else {
          @for (conversation of conversations; track conversation.conversationId) {
            <app-conversation-user
              [data]="conversation"
              [isActive]="isActive(conversation.conversationId)"
              (userClick)="getMessages($event)"
              (conversationUser)="setConversationUser(conversation)"
            ></app-conversation-user>
          }
        }
      </mat-nav-list>

      <app-user-bar></app-user-bar>
    </mat-tab>

    <mat-tab label="Поиск">
      <app-search></app-search>
    </mat-tab>
  </mat-tab-group>
</div>
